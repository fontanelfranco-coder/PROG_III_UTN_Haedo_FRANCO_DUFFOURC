<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardTracker - Ingreso</title>
    <!-- Enlazamos nuestro propio archivo CSS -->
    <link rel="stylesheet" href="Banco.css">
</head>
<body>

    <header class="header">
        <h1>CardTracker</h1>
    </header>

    <main class="main-container">
        <!-- Columna Izquierda (Mensaje) -->
        <section class="hero-section">
            <div class="hero-content">
                <h2 class="hero-title">Varias tarjetas, de diferentes bancos, a través de un único portal.</h2>
            </div>
        </section>
        
        <!-- Columna Derecha (Formulario) -->
        <section class="form-section">
            <div class="form-container">
                <h2 class="form-title">Ingresar a tu cuenta</h2>
                
                <form action="ingreso.php" method="POST">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="tipo_doc">Tipo de doc.</label>
                            <select name="tipo_doc" id="tipo_doc">
                                <option value="DNI">DNI</option>
                                <option value="PASAPORTE">Pasaporte</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="documento">Documento</label>
                            <input type="text" name="documento" id="documento" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="usuario">Usuario Web</label>
                        <input type="text" name="usuario" id="usuario" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" required>
                    </div>

                    <button type="submit" name="ingresar" class="btn-submit">
                        Ingresar
                    </button>
                </form>

                <div class="form-footer">
                    <p><a href="registro.html">¿No tenés una cuenta? Registrate</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        Portal Oficial de Consultas de Liquidaciones CardTracker.
    </footer>

</body>
</html>
